<!doctype html>
<!-- Шаблон картинки для прев'ю посилань (Open Graph, 1200×630). Рендерить scripts/og-image/render.mjs;
     підстановки в подвійних фігурних дужках: LOGO — логотип з src/components/layout/Logo.tsx, HOME — тека public/home. -->
<html lang="uk">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;800&display=block&subset=cyrillic" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    position: relative;
    font-family: "Manrope", sans-serif;
    background: linear-gradient(120deg, #ffffff 0%, #ffffff 46%, #eef4ff 100%);
    color: #0c2150;
  }
  .left { position: absolute; left: 72px; top: 58px; width: 540px; }
  .logo { height: 92px; }
  .logo svg { height: 100%; width: auto; display: block; }
  .accent { width: 84px; height: 6px; border-radius: 3px; background: #FECD14; margin: 30px 0 24px; }
  h1 { font-weight: 800; font-size: 58px; line-height: 1.04; letter-spacing: -1.1px; color: #0c2150; }
  .sub { margin-top: 20px; font-weight: 500; font-size: 26px; line-height: 1.35; color: #44506a; }
  .site {
    position: absolute; left: 72px; bottom: 56px;
    display: inline-flex; align-items: center; gap: 12px;
    font-weight: 800; font-size: 28px; color: #1c56e0;
  }
  .site i { display: block; width: 12px; height: 12px; border-radius: 50%; background: #1c56e0; }

  /* Композиція упаковок — як HeroArt на головній */
  .art { position: absolute; right: 36px; top: 46px; width: 560px; height: 533px; }
  .glow { position: absolute; inset: 8%; border-radius: 50%; background: radial-gradient(circle at 40% 40%, #dbe7ff, #ffffff 55%, #eef4ff); filter: blur(28px); }
  .ring { position: absolute; left: 10%; top: 12%; width: 78%; height: 82%; border-radius: 50%; border: 2px solid #dbe7ff; }
  .item { position: absolute; }
  .item img { width: 100%; height: 100%; object-fit: contain; filter: drop-shadow(0 18px 22px rgba(12, 33, 80, 0.18)); }
</style>
</head>
<body>
  <div class="left">
    <div class="logo">{{LOGO}}</div>
    <div class="accent"></div>
    <h1>Європейські продукти<br>для бізнесу</h1>
    <p class="sub">Імпорт і гуртові поставки для роздрібу, HoReCa та дистриб'юторів</p>
  </div>
  <div class="site"><i></i>lvivimport.com</div>

  <div class="art">
    <div class="glow"></div>
    <div class="ring"></div>
    <div class="item" style="left:0%;top:6%;height:64%;width:32%;transform:rotate(-6deg);z-index:0"><img src="{{HOME}}/viyavo-coffee-classic.webp" alt=""></div>
    <div class="item" style="left:29%;top:0%;height:58%;width:42%;transform:rotate(1deg);z-index:0"><img src="{{HOME}}/barilla-farfalle.webp" alt=""></div>
    <div class="item" style="right:0%;top:10%;height:58%;width:30%;transform:rotate(3deg);z-index:0"><img src="{{HOME}}/viyavo-olyvky-chorni.webp" alt=""></div>
    <div class="item" style="left:20%;bottom:2%;height:50%;width:20%;transform:rotate(-2deg);z-index:20"><img src="{{HOME}}/messis-sik-mango-yabluko-persyk.webp" alt=""></div>
    <div class="item" style="left:40%;bottom:5%;height:56%;width:18%;transform:rotate(2deg);z-index:10"><img src="{{HOME}}/pringles-cheesy-cheese.webp" alt=""></div>
    <div class="item" style="right:0%;bottom:7%;height:22%;width:48%;transform:rotate(-6deg);z-index:30"><img src="{{HOME}}/go-on-protein-bar-chocolate.webp" alt=""></div>
  </div>
</body>
</html>
