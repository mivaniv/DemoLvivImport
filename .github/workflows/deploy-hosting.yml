# Розгортання на хостинг HostPro — ЛИШЕ після підтвердження.
#
# Дві цілі:
#   demo       — demo.lvivimport.com: після кожного push у main (і вручну). Environment «hosting»,
#                файл-позначка lvivimport-demo.txt, заборона індексації (noindex).
#   production — lvivimport.com: ЛИШЕ вручну (Actions → Deploy to hosting → Run workflow → target: production).
#                Environment «production», файл-позначка lvivimport-site.txt. Див. docs/cutover.md.
#
# 1. Сайт збирається (статична версія: каталог без цін, база не потрібна).
# 2. Крок «deploy» прив'язаний до GitHub Environment з обов'язковим рецензентом:
#    GitHub чекає, доки власник натисне «Review deployments → Approve and deploy».
# 3. Перед заливкою перевіряється цільова тека на сервері: у ній має лежати файл-позначка цілі
#    і не повинно бути WordPress/PHP (wp-config.php, index.php, wp-admin...).
# 4. Лише тоді змінені файли заливаються по FTP (curl, кілька з'єднань паралельно).
#
# Налаштування (один раз): див. docs/hosting.md — Environment «hosting», секрети FTP_*, позначка.
name: Deploy to hosting

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: "Куди заливати: demo (demo.lvivimport.com) або production (lvivimport.com)"
        type: choice
        options: [demo, production]
        default: demo

permissions:
  contents: read

concurrency:
  group: hosting-${{ inputs.target || 'demo' }}
  cancel-in-progress: false

env:
  TARGET: ${{ inputs.target || 'demo' }}
  SITE: ${{ inputs.target == 'production' && 'https://lvivimport.com' || 'https://demo.lvivimport.com' }}
  MARKER: ${{ inputs.target == 'production' && 'lvivimport-site.txt' || 'lvivimport-demo.txt' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          # prisma generate (postinstall) читає prisma.config.ts; з'єднання з базою не відбувається
          DATABASE_URL: postgresql://build:build@localhost:5432/build

      - name: Build static site
        run: npx next build
        env:
          NEXT_PUBLIC_STATIC_EXPORT: "1"
          SITE_URL: ${{ env.SITE }}
          DATABASE_URL: postgresql://build:build@localhost:5432/build
          # Форми й кошик-заявка надсилаються на PHP-обробник хостингу (deploy/hosting/api/form.php)
          NEXT_PUBLIC_FORM_ENDPOINT: /api/form.php

      - name: Add hosting config and form handler
        run: |
          cp -r deploy/hosting/api out/api
          if [ "$TARGET" = production ]; then
            # lvivimport.com індексується пошуковиками: без заборони noindex демоверсії
            sed '/# BEGIN demo-only/,/# END demo-only/d' deploy/hosting/.htaccess > out/.htaccess
          else
            cp deploy/hosting/.htaccess out/.htaccess
          fi
          echo "Ціль: $TARGET ($SITE); рядків noindex у .htaccess: $(grep -c 'X-Robots-Tag' out/.htaccess || true)"
          # Позначки старих адрес товарів для переадресацій 301 (.htaccess → api/legacy.php)
          node -e '
            const fs = require("fs");
            const { products } = JSON.parse(fs.readFileSync("out/api/legacy-urls.json", "utf8"));
            fs.mkdirSync("out/api/legacy/product", { recursive: true });
            const slugs = Object.keys(products).filter((s) => /^[a-z0-9-]+$/.test(s));
            for (const s of slugs) fs.writeFileSync("out/api/legacy/product/" + s, "");
            console.log("Старих адрес товарів з переадресацією:", slugs.length);
          '

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: out
          include-hidden-files: true # .htaccess
          retention-days: 7

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Тут GitHub зупиняється й чекає підтвердження власника (правило Environment «hosting»)
    environment:
      # (контекст env тут недоступний — лише inputs)
      name: ${{ inputs.target == 'production' && 'production' || 'hosting' }}
      url: ${{ inputs.target == 'production' && 'https://lvivimport.com' || 'https://demo.lvivimport.com' }}
    steps:
      - name: Check FTP settings and target folder
        id: cfg
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_DIR: ${{ secrets.FTP_DIR }}
          FTP_PROTOCOL: ${{ vars.FTP_PROTOCOL || 'ftps' }}
        run: |
          if [ -z "$FTP_SERVER" ] || [ -z "$FTP_USERNAME" ] || [ -z "$FTP_PASSWORD" ] || [ -z "$FTP_DIR" ]; then
            MISSING=""
            for n in FTP_SERVER FTP_USERNAME FTP_PASSWORD FTP_DIR; do [ -z "${!n}" ] && MISSING="$MISSING $n"; done
            if [ "$TARGET" = "production" ]; then
              echo "::error::У середовищі production бракує секретів:$MISSING. Додайте їх у Settings → Environments → production → Environment secrets"; exit 1
            fi
            echo "::warning::FTP ще не налаштовано (секрети FTP_SERVER, FTP_USERNAME, FTP_PASSWORD, FTP_DIR) — заливку пропущено. Див. docs/hosting.md"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Прибираємо випадкові пробіли/переноси й префікс ftp:// (часто потрапляють під час копіювання)
          FTP_SERVER=$(printf '%s' "$FTP_SERVER" | tr -d '[:space:]' | sed -E 's#^[A-Za-z]+://##; s#/.*$##')
          FTP_DIR=$(printf '%s' "$FTP_DIR" | tr -d '[:space:]')
          if printf '%s' "$FTP_SERVER" | LC_ALL=C grep -q '[^A-Za-z0-9.:-]'; then
            echo "::error::FTP_SERVER містить недопустимі символи (можливо, кирилиця). Введіть секрет заново латиницею, напр. rocket-da8.hostsila.org"; exit 1
          fi
          echo "FTP_HOST=$FTP_SERVER" >> "$GITHUB_ENV"
          echo "FTP_PATH=$FTP_DIR" >> "$GITHUB_ENV"
          case "$FTP_DIR" in
            /*/ | /) ;;
            *) echo "::error::FTP_DIR має починатись і закінчуватись на «/», напр. /public_html/"; exit 1 ;;
          esac

          # Захист від заливки не туди (26.10 демо потрапило в теку WordPress lvivimport.com):
          # заливаємо лише в теку з файлом-позначкою цілі ($MARKER) і без WordPress/PHP.
          case "$FTP_PROTOCOL" in
            ftp) BASE="ftp://$FTP_SERVER"; TLS="" ;;
            ftps-legacy) BASE="ftps://$FTP_SERVER"; TLS="" ;;
            *) BASE="ftp://$FTP_SERVER"; TLS="--ssl-reqd" ;;
          esac
          echo "FTP_BASE=$BASE" >> "$GITHUB_ENV"
          echo "FTP_TLS=$TLS" >> "$GITHUB_ENV"
          list() { curl -sS --max-time 60 --ftp-pasv $TLS --user "$FTP_USERNAME:$FTP_PASSWORD" --list-only "$BASE$FTP_DIR" 2>"$RUNNER_TEMP/ftp.err"; }

          if ! RAW=$(list); then
            HINT=""
            grep -qi 'certificate' "$RUNNER_TEMP/ftp.err" && HINT=" Сертифікат FTPS виданий на інше ім'я — вкажіть у FTP_SERVER ім'я сервера з сертифіката (напр. rocket-da8.hostsila.org)."
            echo "::error::Не вдалося прочитати теку FTP_DIR на сервері: $(head -1 "$RUNNER_TEMP/ftp.err").$HINT"; exit 1
          fi
          LIST=$(printf '%s\n' "$RAW" | tr -d '\r' | sed 's#.*/##' | grep -v '^$' || true)
          SEEN=$(printf '%s\n' "$LIST" | head -30 | paste -sd ',' -)
          echo "Вміст цільової теки: $SEEN"
          if printf '%s\n' "$LIST" | grep -qxE 'wp-config\.php|wp-admin|wp-content|wp-includes|index\.php'; then
            echo "::error::У цільовій теці є WordPress/PHP-сайт — заливку скасовано. Перевірте FTP_DIR і корінь FTP-акаунта. Вміст теки: $SEEN"; exit 1
          fi
          # Файли з крапкою на початку FTP-сервер може не показувати, тому позначка — без крапки
          if ! printf '%s\n' "$LIST" | grep -qxF "$MARKER"; then
            echo "::error::У цільовій теці немає файла-позначки $MARKER (ціль $TARGET) — заливку скасовано. Вміст теки: ${SEEN:-(порожньо)}"; exit 1
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        if: steps.cfg.outputs.ready == 'true'
        with:
          name: site
          path: site

      # Адреса для листів з форм — GitHub Variable FORM_TO_EMAIL (у репозиторій і артефакт збірки не потрапляє).
      # Можна кілька через кому. Щоденний крон (api/update-catalog.php) бере файли 1С прямо з диска
      # (--source у команді крона); секрет IMPORT_SOURCE_URL потрібен лише для старого режиму через HTTP.
      # У config.php усе закрите від відвідувачів (api/.htaccess).
      - name: Add form settings
        if: steps.cfg.outputs.ready == 'true'
        env:
          FORM_TO_EMAIL: ${{ vars.FORM_TO_EMAIL }}
          FORM_FROM_EMAIL: ${{ vars.FORM_FROM_EMAIL || (inputs.target == 'production' && 'noreply@lvivimport.com' || 'noreply@demo.lvivimport.com') }}
          IMPORT_SOURCE_URL: ${{ secrets.IMPORT_SOURCE_URL }}
        run: |
          TO=$(printf '%s' "$FORM_TO_EMAIL" | tr -d '[:space:]')
          FROM=$(printf '%s' "$FORM_FROM_EMAIL" | tr -d '[:space:]')
          FEED=$(printf '%s' "$IMPORT_SOURCE_URL" | tr -d '[:space:]')
          EMAIL='[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}'
          if [ -z "$TO" ]; then
            echo "::error::Не задано адресу для листів з форм: Settings → Secrets and variables → Actions → Variables → FORM_TO_EMAIL. Див. docs/hosting.md"; exit 1
          fi
          if ! printf '%s' "$TO" | grep -qxE "$EMAIL(,$EMAIL)*" || ! printf '%s' "$FROM" | grep -qxE "$EMAIL"; then
            echo "::error::FORM_TO_EMAIL або FORM_FROM_EMAIL — некоректна адреса"; exit 1
          fi
          if [ -n "$FEED" ] && ! printf '%s' "$FEED" | grep -qE '^https?://'; then
            echo "::error::IMPORT_SOURCE_URL має починатись з https:// або http://"; exit 1
          fi
          # Посилання — у base64: будь-які лапки й скісні в ньому не зламають PHP-файл
          printf "<?php\nreturn ['to' => '%s', 'from' => '%s', 'feed' => base64_decode('%s'), 'site' => '%s'];\n" \
            "$TO" "$FROM" "$(printf '%s' "$FEED" | base64 -w0)" "$SITE" > site/api/config.php

      # Заливаються лише змінені файли, пачками по 50 у FTP_PARALLEL з'єднань (curl).
      # Що змінилось, визначає deploy-manifest.txt на сервері: контрольні суми SHA-256 уже залитих файлів;
      # без нього заливається все. Чужі файли в теці (зокрема файл-позначка) не видаляються.
      - name: Upload changed files
        if: steps.cfg.outputs.ready == 'true'
        env:
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PARALLEL: ${{ vars.FTP_PARALLEL || '2' }}
        run: |
          export LC_ALL=C # однакове сортування для sort і comm
          # Прибираємо переноси й пробіли, що потрапляють у секрет під час копіювання
          FTP_USERNAME=$(printf '%s' "$FTP_USERNAME" | tr -d '\r\n' | sed -E 's/^[[:space:]]+//; s/[[:space:]]+$//')
          MANIFEST=deploy-manifest.txt

          # Каталог (data/products.json, sitemap.xml) щодня оновлює крон хостингу (api/update-catalog.php).
          # Коли він уже спрацював (на сервері є data/catalog-status.json), заливка ці файли не перезаписує.
          if curl -sS --max-time 60 --ftp-pasv $FTP_TLS --user "$FTP_USERNAME:$FTP_PASSWORD" --list-only "$FTP_BASE${FTP_PATH}data/" 2>/dev/null \
               | tr -d '\r' | sed 's#.*/##' | grep -qxF catalog-status.json; then
            echo "Каталог веде крон хостингу — data/products.json і sitemap.xml не заливаються"
            rm -f site/data/products.json site/sitemap.xml
          fi
          (cd site && find . -type f -print0 | xargs -0 sha256sum) | sort > "$RUNNER_TEMP/$MANIFEST"

          if curl -sS --max-time 120 --ftp-pasv $FTP_TLS --user "$FTP_USERNAME:$FTP_PASSWORD" \
               -o "$RUNNER_TEMP/old-manifest.txt" "$FTP_BASE$FTP_PATH$MANIFEST" 2>"$RUNNER_TEMP/ftp.err"; then
            echo "Попередня заливка: $(wc -l < "$RUNNER_TEMP/old-manifest.txt") файлів"
          elif [ $? -eq 78 ]; then
            echo "Маніфесту попередньої заливки немає — заливається весь сайт"
            : > "$RUNNER_TEMP/old-manifest.txt"
          else
            echo "::error::Не вдалося прочитати $MANIFEST з сервера: $(head -1 "$RUNNER_TEMP/ftp.err")"; exit 1
          fi

          sort -o "$RUNNER_TEMP/old-manifest.txt" "$RUNNER_TEMP/old-manifest.txt"

          # Рядки «хеш  ./шлях», яких не було в попередній заливці → нові або змінені файли
          comm -13 "$RUNNER_TEMP/old-manifest.txt" "$RUNNER_TEMP/$MANIFEST" > "$RUNNER_TEMP/changed.txt"
          COUNT=$(grep -c . "$RUNNER_TEMP/changed.txt" || true)
          echo "Змінених файлів: $COUNT з $(wc -l < "$RUNNER_TEMP/$MANIFEST")"
          if [ "$COUNT" -eq 0 ]; then echo "Заливати нічого"; exit 0; fi
          head -20 "$RUNNER_TEMP/changed.txt" | cut -c67-

          # Пачки по 50 файлів; кожна пачка — один curl і одне FTP-з'єднання, пачки йдуть паралельно.
          # Залита пачка позначається файлом .ok — з них крок «Save upload progress» складає маніфест.
          cd site
          split -l 50 -d -a 4 "$RUNNER_TEMP/changed.txt" "$RUNNER_TEMP/batch-"
          cat > "$RUNNER_TEMP/upload-batch.sh" <<'SH'
          set -o pipefail
          batch="$1"; conf="$batch.curl"; name=$(basename "$batch")
          # Пари «файл → адреса» у конфігурації curl (без лапок і зворотних скісних у назвах файлів збірки)
          cut -c67- "$batch" | sed 's#^\./##' | while IFS= read -r f; do
            enc=$(printf '%s' "$f" | sed 's/%/%25/g; s/ /%20/g; s/#/%23/g; s/?/%3F/g')
            printf 'upload-file = "%s"\nurl = "%s%s%s"\n' "$f" "$FTP_BASE" "$FTP_PATH" "$enc"
          done > "$conf"
          # Сервер повільний: обриваємо лише завислу передачу (менше 1 байта/с упродовж 2 хв) і повторюємо
          if curl -sS --fail-early --ftp-create-dirs --ftp-pasv $FTP_TLS --connect-timeout 60 \
               --speed-limit 1 --speed-time 120 --retry 5 --retry-delay 10 --retry-all-errors \
               -K "$RUNNER_TEMP/auth.curl" -K "$conf" 2>"$batch.err"; then
            cp "$batch" "$batch.ok"
            echo "$name: $(wc -l < "$batch") файлів, усього залито $(cat "$RUNNER_TEMP"/batch-*.ok | wc -l)"
          else
            echo "::error::Заливка пачки $name не вдалась: $(grep -v '^$' "$batch.err" | tail -1)"; exit 1
          fi
          SH
          # Логін і пароль — у файлі конфігурації curl, а не в командному рядку процесів
          ( umask 077; printf 'user = "%s:%s"\n' "$(printf '%s' "$FTP_USERNAME" | sed 's/[\\"]/\\&/g')" \
              "$(printf '%s' "$FTP_PASSWORD" | tr -d '\r\n' | sed 's/[\\"]/\\&/g')" > "$RUNNER_TEMP/auth.curl" )
          export FTP_BASE FTP_PATH FTP_TLS RUNNER_TEMP
          touch "$RUNNER_TEMP/upload-started"
          find "$RUNNER_TEMP" -maxdepth 1 -name 'batch-[0-9][0-9][0-9][0-9]' | sort | xargs -P "$FTP_PARALLEL" -n 1 bash "$RUNNER_TEMP/upload-batch.sh"

      # Виконується й після збою чи скасування заливки: маніфест = незмінені файли + залиті пачки.
      # Тож повторний запуск («Re-run jobs») доллє лише те, що не встигло залитись.
      - name: Save upload progress
        if: always() && steps.cfg.outputs.ready == 'true'
        run: |
          export LC_ALL=C
          [ -f "$RUNNER_TEMP/upload-started" ] || exit 0
          MANIFEST=deploy-manifest.txt
          { comm -12 "$RUNNER_TEMP/old-manifest.txt" "$RUNNER_TEMP/$MANIFEST"; cat "$RUNNER_TEMP"/batch-*.ok 2>/dev/null || true; } \
            | sort -u > "$RUNNER_TEMP/upload-manifest.txt"
          DONE=$( (cat "$RUNNER_TEMP"/batch-*.ok 2>/dev/null || true) | wc -l)
          COUNT=$(wc -l < "$RUNNER_TEMP/changed.txt")
          curl -sS --ftp-pasv $FTP_TLS --connect-timeout 60 --retry 5 --retry-delay 10 --retry-all-errors \
            -K "$RUNNER_TEMP/auth.curl" -T "$RUNNER_TEMP/upload-manifest.txt" "$FTP_BASE$FTP_PATH$MANIFEST"
          echo "Залито файлів: $DONE з $COUNT"
          if [ "$DONE" -lt "$COUNT" ]; then
            echo "::warning::Залито $DONE з $COUNT файлів. Запустіть заливку ще раз (Re-run all jobs) — вона продовжить з місця зупинки."
          fi
