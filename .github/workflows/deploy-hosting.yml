# Розгортання на хостинг HostPro (demo.lvivimport.com) — ЛИШЕ після підтвердження.
#
# 1. Після push у main сайт збирається (статична версія: каталог без цін, база не потрібна).
# 2. Крок «deploy» прив'язаний до GitHub Environment «hosting» з обов'язковим рецензентом:
#    GitHub чекає, доки власник натисне «Review deployments → Approve and deploy».
# 3. Перед заливкою перевіряється цільова тека на сервері: у ній має лежати файл-позначка
#    lvivimport-demo.txt і не повинно бути WordPress/PHP (wp-config.php, index.php, wp-admin...).
# 4. Лише тоді змінені файли заливаються по FTP у теку демосайту.
#
# Налаштування (один раз): див. docs/hosting.md — Environment «hosting», секрети FTP_*, позначка.
name: Deploy to hosting (demo.lvivimport.com)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hosting
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          # prisma generate (postinstall) читає prisma.config.ts; з'єднання з базою не відбувається
          DATABASE_URL: postgresql://build:build@localhost:5432/build

      - name: Build static site
        run: npx next build
        env:
          NEXT_PUBLIC_STATIC_EXPORT: "1"
          SITE_URL: https://demo.lvivimport.com
          DATABASE_URL: postgresql://build:build@localhost:5432/build

      - name: Add hosting config
        run: cp deploy/hosting/.htaccess out/.htaccess

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: out
          include-hidden-files: true # .htaccess
          retention-days: 7

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Тут GitHub зупиняється й чекає підтвердження власника (правило Environment «hosting»)
    environment:
      name: hosting
      url: https://demo.lvivimport.com
    steps:
      - name: Check FTP settings and target folder
        id: cfg
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_DIR: ${{ secrets.FTP_DIR }}
          FTP_PROTOCOL: ${{ vars.FTP_PROTOCOL || 'ftps' }}
        run: |
          if [ -z "$FTP_SERVER" ] || [ -z "$FTP_USERNAME" ] || [ -z "$FTP_PASSWORD" ] || [ -z "$FTP_DIR" ]; then
            echo "::warning::FTP ще не налаштовано (секрети FTP_SERVER, FTP_USERNAME, FTP_PASSWORD, FTP_DIR) — заливку пропущено. Див. docs/hosting.md"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          case "$FTP_DIR" in
            /*/ | /) ;;
            *) echo "::error::FTP_DIR має починатись і закінчуватись на «/», напр. /public_html/"; exit 1 ;;
          esac

          # Захист від заливки не туди (26.10 сайт потрапив у теку lvivimport.com):
          # заливаємо лише в теку з файлом-позначкою lvivimport-demo.txt і без WordPress/PHP.
          case "$FTP_PROTOCOL" in
            ftp) BASE="ftp://$FTP_SERVER"; TLS="" ;;
            ftps-legacy) BASE="ftps://$FTP_SERVER"; TLS="" ;;
            *) BASE="ftp://$FTP_SERVER"; TLS="--ssl-reqd" ;;
          esac
          list() { curl -sS --max-time 60 --ftp-pasv $TLS --user "$FTP_USERNAME:$FTP_PASSWORD" --list-only "$BASE$FTP_DIR" 2>"$RUNNER_TEMP/ftp.err"; }

          if ! RAW=$(list); then
            HINT=""
            grep -qi 'certificate' "$RUNNER_TEMP/ftp.err" && HINT=" Сертифікат FTPS виданий на інше ім'я — вкажіть у FTP_SERVER ім'я сервера з сертифіката (напр. rocket-da8.hostsila.org)."
            echo "::error::Не вдалося прочитати теку FTP_DIR на сервері: $(head -1 "$RUNNER_TEMP/ftp.err").$HINT"; exit 1
          fi
          LIST=$(printf '%s\n' "$RAW" | tr -d '\r' | sed 's#.*/##' | grep -v '^$' || true)
          SEEN=$(printf '%s\n' "$LIST" | head -30 | paste -sd ',' -)
          echo "Вміст цільової теки: $SEEN"
          if printf '%s\n' "$LIST" | grep -qxE 'wp-config\.php|wp-admin|wp-content|wp-includes|index\.php'; then
            echo "::error::У цільовій теці є WordPress/PHP-сайт — заливку скасовано. Перевірте FTP_DIR і корінь FTP-акаунта. Вміст теки: $SEEN"; exit 1
          fi
          # Файли з крапкою на початку FTP-сервер може не показувати, тому позначка — без крапки
          if ! printf '%s\n' "$LIST" | grep -qxF 'lvivimport-demo.txt'; then
            echo "::error::У цільовій теці немає файла-позначки lvivimport-demo.txt — заливку скасовано. Вміст теки: ${SEEN:-(порожньо)}"; exit 1
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        if: steps.cfg.outputs.ready == 'true'
        with:
          name: site
          path: site

      # Заливаються лише змінені файли; чужі файли в теці (зокрема lvivimport-demo.txt) не видаляються
      - uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        if: steps.cfg.outputs.ready == 'true'
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ vars.FTP_PROTOCOL || 'ftps' }}
          local-dir: ./site/
          server-dir: ${{ secrets.FTP_DIR }}
