# Розгортання на хостинг HostPro (demo.lvivimport.com) — ЛИШЕ після підтвердження.
#
# 1. Після push у main сайт збирається (статична версія: каталог без цін, база не потрібна).
# 2. Крок «deploy» прив'язаний до GitHub Environment «hosting» з обов'язковим рецензентом:
#    GitHub чекає, доки власник натисне «Review deployments → Approve and deploy».
# 3. Після підтвердження змінені файли заливаються по FTP у теку демосайту.
#
# Налаштування (один раз): див. docs/hosting.md — Environment «hosting», секрети FTP_*.
name: Deploy to hosting (demo.lvivimport.com)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hosting
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          # prisma generate (postinstall) читає prisma.config.ts; з'єднання з базою не відбувається
          DATABASE_URL: postgresql://build:build@localhost:5432/build

      - name: Build static site
        run: npx next build
        env:
          NEXT_PUBLIC_STATIC_EXPORT: "1"
          SITE_URL: https://demo.lvivimport.com
          DATABASE_URL: postgresql://build:build@localhost:5432/build

      - name: Add hosting config
        run: cp deploy/hosting/.htaccess out/.htaccess

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: out
          include-hidden-files: true # .htaccess
          retention-days: 7

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Тут GitHub зупиняється й чекає підтвердження власника (правило Environment «hosting»)
    environment:
      name: hosting
      url: https://demo.lvivimport.com
    steps:
      - name: Check FTP settings
        id: cfg
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_DIR: ${{ secrets.FTP_DIR }}
          # true — FTP-акаунт бачить лише теку демосайту (рекомендовано), тоді FTP_DIR = "/"
          # (змінна у Variables або, якщо створено як секрет, у Secrets; регістр і пробіли не важливі)
          DEDICATED: ${{ vars.FTP_DEDICATED_ACCOUNT || secrets.FTP_DEDICATED_ACCOUNT }}
        run: |
          DEDICATED=$(printf '%s' "$DEDICATED" | tr -d '[:space:]"' | tr '[:upper:]' '[:lower:]')
          if [ -z "$FTP_SERVER" ] || [ -z "$FTP_USERNAME" ] || [ -z "$FTP_PASSWORD" ] || [ -z "$FTP_DIR" ]; then
            echo "::warning::FTP ще не налаштовано (секрети FTP_SERVER, FTP_USERNAME, FTP_PASSWORD, FTP_DIR) — заливку пропущено. Див. docs/hosting.md"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          case "$FTP_DIR" in
            */) ;;
            *) echo "::error::FTP_DIR має закінчуватись на «/»"; exit 1 ;;
          esac
          # Захист від заливки в теку lvivimport.com: спільний FTP-акаунт — лише в теку з «demo» у шляху
          if [ "$DEDICATED" != "true" ]; then
            case "$FTP_DIR" in
              *demo*) ;;
              *) echo "::error::FTP_DIR має вказувати на теку демосайту (містити «demo»), або створіть окремий FTP-акаунт лише для неї і задайте змінну FTP_DEDICATED_ACCOUNT=true"; exit 1 ;;
            esac
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        if: steps.cfg.outputs.ready == 'true'
        with:
          name: site
          path: site

      # Заливаються лише змінені файли; чужі файли в теці не видаляються
      - uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        if: steps.cfg.outputs.ready == 'true'
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ vars.FTP_PROTOCOL || 'ftps' }}
          local-dir: ./site/
          server-dir: ${{ secrets.FTP_DIR }}
